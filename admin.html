<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Battle Born BIO — Control Center</title>
  
  <!-- Tailwind CSS & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#0a0a12',
              card: '#121220',
              pink: '#ff007f',
              magenta: '#d800ff',
              cyan: '#00f0ff',
              border: '#2a2a40'
            }
          },
          boxShadow: {
            'neon-pink': '0 0 15px rgba(255, 0, 127, 0.4)',
            'neon-cyan': '0 0 15px rgba(0, 240, 255, 0.4)'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0a12; color: #e2e8f0; }
    .glow-text-cyan { text-shadow: 0 0 8px #00f0ff; }
  </style>
</head>
<body class="bg-cyber-black text-slate-100 min-h-screen p-6 font-sans">

  <header class="max-w-6xl mx-auto flex items-center justify-between border-b border-cyber-border pb-6 mb-8">
    <div class="flex items-center gap-3">
      <img src="brand/logo.jpg" alt="Logo" class="h-10 w-auto rounded border border-cyber-cyan shadow-neon-cyan" onerror="this.src='https://via.placeholder.com/150?text=Logo'"/>
      <div>
        <h1 class="text-2xl font-black text-white glow-text-cyan">CONTROL CENTER</h1>
        <p class="text-xs text-cyber-pink font-bold uppercase tracking-widest">Inventory & Pricing Management</p>
      </div>
    </div>
    <a href="/" target="_blank" class="text-xs bg-cyber-card border border-cyber-border text-slate-300 px-4 py-2 rounded-lg hover:border-cyber-cyan transition font-bold">
      🌐 View Live Storefront →
    </a>
  </header>

  <main class="max-w-6xl mx-auto">
    <div id="status-msg" class="hidden mb-6 p-4 rounded-lg text-sm font-bold border"></div>

    <div class="bg-cyber-card border border-cyber-border rounded-2xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-6 border-b border-cyber-border pb-4">
        <h2 class="text-lg font-bold text-white uppercase tracking-wider">Master Product Inventory</h2>
        <button onclick="saveAllChanges()" class="bg-gradient-to-r from-cyber-pink to-cyber-magenta text-white text-sm font-bold px-5 py-2.5 rounded-lg hover:shadow-neon-pink transition">
          💾 Save All Changes
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-cyber-border text-xs uppercase tracking-widest text-slate-400 bg-cyber-black/50">
              <th class="p-3">ID</th>
              <th class="p-3">Product Name</th>
              <th class="p-3">Category</th>
              <th class="p-3">Price ($)</th>
              <th class="p-3">Stock (Vials)</th>
              <th class="p-3">Image Path</th>
            </tr>
          </thead>
          <tbody id="inventory-rows" class="divide-y divide-cyber-border text-sm">
            <tr>
              <td colspan="6" class="p-4 text-center text-slate-500">Loading live inventory from Supabase...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://talpzrqtbmducmcygfbc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6IxcTiIwPQPKqRIkJVT-IA_8J_QFs7n';
    
    let sbClient = null;
    if (window.supabase && window.supabase.createClient) {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let localInventory = [];

    async function loadAdminInventory() {
      if (!sbClient) return;

      try {
        const { data, error } = await sbClient.from('inventory').select('*').order('id', { ascending: true });
        if (error) throw error;

        localInventory = data;
        renderAdminRows();
      } catch (err) {
        showStatus('Error fetching database inventory: ' + err.message, 'error');
      }
    }

    function renderAdminRows() {
      const tbody = document.getElementById('inventory-rows');
      if (!tbody) return;

      tbody.innerHTML = localInventory.map((item, index) => {
        const stockNum = parseInt(item.stock || 0);
        const isOut = stockNum <= 0;

        return `
          <tr class="hover:bg-cyber-black/30 transition">
            <td class="p-3 font-mono text-slate-400">${item.id}</td>
            <td class="p-3 font-bold text-white">${item.name}</td>
            <td class="p-3 text-xs text-cyber-pink uppercase font-semibold">${item.category || 'General'}</td>
            <td class="p-3">
              <input type="number" step="0.01" value="${parseFloat(item.price).toFixed(2)}" 
                onchange="updateLocalValue(${index}, 'price', this.value)"
                class="w-24 bg-cyber-black border border-cyber-border rounded p-1.5 text-cyber-cyan font-bold focus:border-cyber-cyan focus:outline-none"/>
            </td>
            <td class="p-3">
              <div class="flex items-center gap-2">
                <input type="number" value="${stockNum}" 
                  onchange="updateLocalValue(${index}, 'stock', this.value)"
                  class="w-20 bg-cyber-black border border-cyber-border rounded p-1.5 font-bold ${isOut ? 'text-rose-400' : 'text-white'} focus:border-cyber-pink focus:outline-none"/>
                <span class="text-xs ${isOut ? 'text-rose-400 font-bold' : 'text-slate-500'}">
                  ${isOut ? 'SOLD OUT' : 'Vials'}
                </span>
              </div>
            </td>
            <td class="p-3 text-xs font-mono text-slate-400">
              <input type="text" value="${item.image || ''}" 
                onchange="updateLocalValue(${index}, 'image', this.value)"
                class="w-full bg-cyber-black border border-cyber-border rounded p-1.5 text-slate-300 focus:border-cyber-cyan focus:outline-none"/>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateLocalValue(index, field, value) {
      if (localInventory[index]) {
        localInventory[index][field] = field === 'price' || field === 'stock' ? parseFloat(value) || 0 : value;
      }
    }

    async function saveAllChanges() {
      if (!sbClient) return;

      const statusBox = document.getElementById('status-msg');
      showStatus('Saving changes to Supabase...', 'info');

      try {
        for (const item of localInventory) {
          const { error } = await sbClient.from('inventory').update({
            price: item.price,
            stock: item.stock,
            image: item.image
          }).eq('id', item.id);

          if (error) throw error;
        }

        showStatus('✅ All inventory changes successfully saved to live database!', 'success');
        loadAdminInventory();
      } catch (err) {
        showStatus('⚠️ Failed to save changes: ' + err.message, 'error');
      }
    }

    function showStatus(msg, type) {
      const box = document.getElementById('status-msg');
      box.classList.remove('hidden', 'bg-emerald-900/40', 'border-emerald-500', 'text-emerald-300', 'bg-rose-900/40', 'border-rose-500', 'text-rose-300', 'bg-cyber-black', 'border-cyber-cyan', 'text-cyber-cyan');

      if (type === 'success') {
        box.classList.add('bg-emerald-900/40', 'border-emerald-500', 'text-emerald-300');
      } else if (type === 'error') {
        box.classList.add('bg-rose-900/40', 'border-rose-500', 'text-rose-300');
      } else {
        box.classList.add('bg-cyber-black', 'border-cyber-cyan', 'text-cyber-cyan');
      }

      box.innerText = msg;
    }

    loadAdminInventory();
  </script>
</body>
</html>
