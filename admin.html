<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Battle Born BIO — Simple Catalog Control</title>
  <link rel="icon" type="image/jpeg" href="brand/logo.jpg"/>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#0a0a12',
              card: '#121220',
              pink: '#ff007f',
              magenta: '#d800ff',
              cyan: '#00f0ff',
              yellow: '#ffe600',
              border: '#2a2a40'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0a12; color: #e2e8f0; }
  </style>
</head>
<body class="bg-cyber-black text-slate-100 min-h-screen p-6 max-w-7xl mx-auto font-sans">

  <!-- Header -->
  <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-cyber-border pb-6 mb-6">
    <div class="flex items-center gap-3">
      <img src="brand/logo.jpg" alt="Logo" class="h-10 w-auto rounded border border-cyber-cyan" onerror="this.src='https://via.placeholder.com/150?text=Logo'"/>
      <div>
        <h1 class="text-xl font-black text-white tracking-wider">BATTLE BORN BIO — DIRECT CATALOG HUB</h1>
        <p class="text-xs text-slate-400">Zero database setup. Toggle visibility, edit prices, set stock, and reorder freely.</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="exportCatalogJSON()" class="bg-cyber-black border border-cyber-border text-slate-300 text-xs font-bold px-3 py-2 rounded-lg hover:border-cyber-cyan transition">
        📥 Export Backup
      </button>
      <button onclick="openAddModal()" class="bg-cyber-cyan text-black text-xs font-black px-4 py-2 rounded-lg hover:opacity-90 uppercase">
        ➕ New Item
      </button>
      <button onclick="saveAllChanges()" class="bg-gradient-to-r from-cyber-pink to-cyber-magenta text-white text-xs font-black px-5 py-2 rounded-lg shadow-lg hover:opacity-90 uppercase">
        💾 Save All Changes
      </button>
    </div>
  </header>

  <div id="notice-box" class="hidden mb-4 p-3 rounded-lg text-xs font-bold bg-emerald-950 border border-emerald-500 text-emerald-300"></div>

  <!-- Product Management Table -->
  <div class="bg-cyber-card border border-cyber-border rounded-2xl p-4 overflow-x-auto">
    <table class="w-full text-left text-xs border-collapse">
      <thead>
        <tr class="border-b border-cyber-border text-slate-400 uppercase tracking-widest bg-cyber-black/60">
          <th class="p-3">Status</th>
          <th class="p-3 text-center">Pos #</th>
          <th class="p-3">Compound Name</th>
          <th class="p-3">Category</th>
          <th class="p-3">Retail Price ($)</th>
          <th class="p-3">Stock Count</th>
          <th class="p-3">Image Path</th>
          <th class="p-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="inventory-rows" class="divide-y divide-cyber-border">
        <!-- Rendered via JS -->
      </tbody>
    </table>
  </div>

  <!-- Add / Edit Modal -->
  <div id="item-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-cyber-card border border-cyber-cyan rounded-2xl max-w-md w-full p-6 text-xs relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-base">✕</button>
      <h3 id="modal-heading" class="text-base font-black text-white mb-4 uppercase text-cyber-cyan">➕ Add Product</h3>
      
      <form id="product-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="form-edit-id" value=""/>
        <div>
          <label class="block text-slate-400 mb-1 font-bold">Product Name</label>
          <input type="text" id="form-name" required placeholder="e.g. R3 (Retatrutide 10mg)" class="w-full bg-cyber-black border border-cyber-border p-2 rounded text-white focus:outline-none"/>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Category</label>
            <input type="text" id="form-cat" required placeholder="Peptides" class="w-full bg-cyber-black border border-cyber-border p-2 rounded text-white focus:outline-none"/>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Display Position #</label>
            <input type="number" id="form-order" value="1" required class="w-full bg-cyber-black border border-cyber-border p-2 rounded text-cyber-cyan font-bold focus:outline-none"/>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Price ($)</label>
            <input type="number" step="0.01" id="form-price" required placeholder="70.00" class="w-full bg-cyber-black border border-cyber-border p-2 rounded text-cyber-cyan font-bold focus:outline-none"/>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Current Stock</label>
            <input type="number" id="form-stock" required value="10" class="w-full bg-cyber-black border border-cyber-border p-2 rounded text-white focus:outline-none"/>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-bold">Image File Path</label>
          <input type="text" id="form-img" value="products/Blank Vial.png" class="w-full bg-cyber-black border border-cyber-border p-2 rounded text-slate-300 font-mono focus:outline-none"/>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-bold">Sales Description</label>
          <textarea id="form-desc" placeholder="Write description..." class="w-full bg-cyber-black border border-cyber-border p-2 rounded text-white h-20 focus:outline-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-cyber-cyan to-cyber-magenta text-black font-black py-2.5 rounded-lg uppercase mt-2">
          Save Product Item →
        </button>
      </form>
    </div>
  </div>

  <script>
    const STORE_KEY = 'bbb_local_inventory_v1';
    let localInventory = [];

    const defaultCatalog = [
      { id: '1', display_order: 1, active: true, name: 'R3 (Retatrutide 10mg)', category: 'Growth-Factor Reagents', price: 70.00, stock: 10, image: 'products/R3 10.png', description: 'Triple-agonist reference reagent across GIP, GLP-1, and Glucagon receptor pathways.' },
      { id: '2', display_order: 2, active: true, name: 'R3 (Retatrutide 20mg)', category: 'Growth-Factor Reagents', price: 120.00, stock: 18, image: 'products/R3 20.png', description: 'High-yield tri-agonist standard formulated for rapid metabolic turnover assays.' },
      { id: '3', display_order: 3, active: true, name: 'BPC-157 (10mg)', category: 'Peptide Reagents', price: 50.00, stock: 25, image: 'products/BPC-157 10.png', description: 'Pentadecapeptide reference standard evaluated for cellular and tissue repair.' },
      { id: '4', display_order: 4, active: true, name: '5-Amino-1MQ (50mg)', category: 'Small-Molecule Reagents', price: 60.00, stock: 10, image: 'products/5-Amino-1MQ 50.png', description: 'Selective NNMT inhibitor used in cellular energetic efficiency assays.' },
      { id: '5', display_order: 5, active: true, name: 'GHK-Cu (100mg)', category: 'Copper Peptides', price: 75.00, stock: 10, image: 'products/GHK-cu 100.png', description: 'Copper tripeptide complex studied for collagen matrix remodeling.' },
      { id: '6', display_order: 6, active: true, name: 'Tesamorelin (10mg)', category: 'Peptide Analogues', price: 105.00, stock: 10, image: 'products/Tesamorelin 10.png', description: 'GHRH analogue evaluated for pituitary GH synthesis stimulation.' },
      { id: '7', display_order: 7, active: true, name: 'NAD+ (500mg)', category: 'Coenzymes', price: 75.00, stock: 10, image: 'products/NAD+ 500.png', description: 'Essential coenzyme required for sirtuin activation and ATP synthesis.' },
      { id: '8', display_order: 8, active: true, name: 'SS-31 (10mg)', category: 'Mitochondrial Peptides', price: 65.00, stock: 5, image: 'products/SS-31 10.png', description: 'Mitochondria-targeted peptide evaluated for electron transport balance.' },
      { id: '9', display_order: 9, active: true, name: 'SS-31 (50mg)', category: 'Mitochondrial Peptides', price: 150.00, stock: 10, image: 'products/SS-31 50.png', description: 'High-dose mitochondrial rescue compound for oxidative stress models.' },
      { id: '10', display_order: 10, active: true, name: 'MOTS-C (20mg)', category: 'Mitochondrial Peptides', price: 75.00, stock: 10, image: 'products/Mots-C 20.png', description: 'Mitochondrial-derived peptide examined for AMPK phosphorylation.' },
      { id: '11', display_order: 11, active: true, name: 'Selank (10mg)', category: 'Nootropic Peptides', price: 65.00, stock: 10, image: 'products/Selank 10.png', description: 'Synthetic heptapeptide studied for BDNF expression stability.' },
      { id: '12', display_order: 12, active: true, name: 'Semax (10mg)', category: 'Nootropic Peptides', price: 65.00, stock: 10, image: 'products/Semax 10.png', description: 'ACTH analogue evaluated for CNS trophic factor upregulation.' },
      { id: '13', display_order: 13, active: true, name: 'Semaglutide (20mg)', category: 'Peptide Analogues', price: 50.00, stock: 10, image: 'products/Semaglutide 20.png', description: 'Long-acting GLP-1 receptor agonist reference compound.' }
    ];

    function loadInventory() {
      const stored = localStorage.getItem(STORE_KEY);
      if (stored) {
        try { localInventory = JSON.parse(stored); } catch (e) { localInventory = defaultCatalog; }
      } else {
        localInventory = defaultCatalog;
        localStorage.setItem(STORE_KEY, JSON.stringify(defaultCatalog));
      }
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('inventory-rows');
      localInventory.sort((a, b) => (parseInt(a.display_order) || 99) - (parseInt(b.display_order) || 99));

      tbody.innerHTML = localInventory.map((item, index) => {
        const isActive = item.active !== false;
        return `
          <tr class="hover:bg-cyber-black/40 transition">
            <td class="p-3">
              <button onclick="toggleItemActive(${index})" class="px-2 py-1 rounded text-[10px] font-black uppercase ${isActive ? 'bg-emerald-950 text-emerald-300 border border-emerald-500' : 'bg-slate-900 text-slate-500 border border-slate-700'}">
                ${isActive ? '● Live' : '○ Draft'}
              </button>
            </td>
            <td class="p-3 text-center">
              <input type="number" value="${item.display_order || index + 1}" onchange="updateRow(${index}, 'display_order', this.value)" class="w-12 bg-cyber-black border border-cyber-cyan p-1 text-center font-bold text-cyber-cyan rounded focus:outline-none"/>
            </td>
            <td class="p-3 font-bold text-white">${item.name}</td>
            <td class="p-3 text-slate-400">${item.category || 'Reagent'}</td>
            <td class="p-3">
              <input type="number" step="0.01" value="${parseFloat(item.price).toFixed(2)}" onchange="updateRow(${index}, 'price', this.value)" class="w-20 bg-cyber-black border border-cyber-border p-1 text-cyber-cyan font-bold rounded focus:outline-none"/>
            </td>
            <td class="p-3">
              <input type="number" value="${item.stock || 0}" onchange="updateRow(${index}, 'stock', this.value)" class="w-16 bg-cyber-black border border-cyber-border p-1 text-white font-bold rounded focus:outline-none"/>
            </td>
            <td class="p-3">
              <input type="text" value="${item.image || ''}" onchange="updateRow(${index}, 'image', this.value)" class="w-32 bg-cyber-black border border-cyber-border p-1 text-slate-400 font-mono rounded text-[10px] focus:outline-none"/>
            </td>
            <td class="p-3 text-right">
              <button onclick="openEditModal(${index})" class="text-cyber-cyan hover:underline font-bold mr-2">Edit</button>
              <button onclick="deleteItem(${index})" class="text-rose-400 hover:underline font-bold">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleItemActive(index) {
      localInventory[index].active = (localInventory[index].active === false);
      saveToStorage();
      renderTable();
    }

    function updateRow(index, field, value) {
      if (field === 'price' || field === 'stock' || field === 'display_order') {
        localInventory[index][field] = parseFloat(value) || 0;
      } else {
        localInventory[index][field] = value;
      }
      saveToStorage();
    }

    function saveToStorage() {
      localStorage.setItem(STORE_KEY, JSON.stringify(localInventory));
    }

    function saveAllChanges() {
      saveToStorage();
      showNotice('✅ All prices, stock counts, and sequence positions saved!');
      renderTable();
    }

    function openAddModal() {
      document.getElementById('modal-heading').innerText = "➕ Add Product";
      document.getElementById('form-edit-id').value = "";
      document.getElementById('product-form').reset();
      document.getElementById('form-order').value = localInventory.length + 1;
      document.getElementById('item-modal').classList.remove('hidden');
    }

    function openEditModal(index) {
      const item = localInventory[index];
      document.getElementById('modal-heading').innerText = `✏️ Edit ${item.name}`;
      document.getElementById('form-edit-id').value = item.id;
      document.getElementById('form-name').value = item.name;
      document.getElementById('form-cat').value = item.category;
      document.getElementById('form-order').value = item.display_order || index + 1;
      document.getElementById('form-price').value = item.price;
      document.getElementById('form-stock').value = item.stock;
      document.getElementById('form-img').value = item.image;
      document.getElementById('form-desc').value = item.description || '';
      document.getElementById('item-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('form-edit-id').value;

      const payload = {
        id: editId || String(Date.now()),
        display_order: parseInt(document.getElementById('form-order').value) || 1,
        active: true,
        name: document.getElementById('form-name').value.trim(),
        category: document.getElementById('form-cat').value.trim(),
        price: parseFloat(document.getElementById('form-price').value) || 0,
        stock: parseInt(document.getElementById('form-stock').value) || 0,
        image: document.getElementById('form-img').value.trim(),
        description: document.getElementById('form-desc').value.trim()
      };

      if (editId) {
        const idx = localInventory.findIndex(x => x.id === editId);
        if (idx !== -1) localInventory[idx] = payload;
      } else {
        localInventory.push(payload);
      }

      saveToStorage();
      closeModal();
      renderTable();
      showNotice('✅ Product saved successfully!');
    }

    function deleteItem(index) {
      if (!confirm(`Delete ${localInventory[index].name}?`)) return;
      localInventory.splice(index, 1);
      saveToStorage();
      renderTable();
      showNotice('Product removed.');
    }

    function exportCatalogJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localInventory, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "battlebornbio_catalog.json");
      dlAnchor.click();
    }

    function showNotice(msg) {
      const box = document.getElementById('notice-box');
      box.innerText = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 3500);
    }

    loadInventory();
  </script>
</body>
</html>
