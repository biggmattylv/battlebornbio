<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Battle Born BIO — Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#0A0C10',
              dark: '#12161F',
              card: '#1A202C',
              cyan: '#00F0FF',
              pink: '#FF007F',
              green: '#00FF66',
              yellow: '#FFE600'
            }
          }
        }
      }
    }
  </script>
  <style>
    .neon-border-cyan { box-shadow: 0 0 10px #00F0FF, inset 0 0 10px #00F0FF; }
    .neon-text-cyan { text-shadow: 0 0 8px #00F0FF; }
    .neon-text-pink { text-shadow: 0 0 8px #FF007F; }
    .neon-button {
      background: linear-gradient(135deg, #00F0FF 0%, #FF007F 100%);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .neon-button:hover {
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
    }
  </style>
</head>
<body class="bg-cyber-black text-stone-100 font-mono min-h-screen flex flex-col">

  <!-- Password Authentication Screen -->
  <div id="auth-screen" class="fixed inset-0 bg-cyber-black/95 z-50 flex items-center justify-center p-4">
    <div class="bg-cyber-dark border border-cyber-cyan/40 p-8 rounded-2xl max-w-md w-full shadow-[0_0_30px_rgba(0,240,255,0.2)]">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold tracking-widest text-cyber-cyan neon-text-cyan">BATTLE BORN BIO</h1>
        <p class="text-xs text-cyber-pink uppercase tracking-widest mt-1">RESTRICTED ADMIN COMMAND CENTER</p>
      </div>
      <form onsubmit="authenticate(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-400 mb-2">Access Key / Password</label>
          <input type="password" id="admin-pass" required placeholder="••••••••••••" 
            class="w-full bg-cyber-black border border-cyber-cyan/30 rounded px-4 py-3 text-cyber-cyan focus:outline-none focus:border-cyber-cyan focus:ring-1 focus:ring-cyber-cyan"/>
        </div>
        <button type="submit" class="w-full neon-button text-black font-bold py-3 rounded uppercase tracking-wider transition duration-300">
          Authorize Access →
        </button>
        <p id="auth-error" class="text-red-500 text-xs text-center hidden mt-2">ACCESS DENIED: Invalid Access Key</p>
      </form>
    </div>
  </div>

  <!-- Main Cyberpunk Command Center Dashboard -->
  <div id="dashboard" class="hidden flex-1 flex flex-col">
    <!-- Top Navigation Bar -->
    <header class="bg-cyber-dark border-b border-cyber-cyan/20 px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="h-3 w-3 rounded-full bg-cyber-green animate-pulse shadow-[0_0_8px_#00FF66]"></span>
        <span class="font-bold text-lg text-cyber-cyan tracking-wider">BATTLE BORN BIO // SYS_ADMIN</span>
      </div>
      <button onclick="logout()" class="text-xs text-stone-400 hover:text-cyber-pink border border-stone-700 hover:border-cyber-pink px-3 py-1.5 rounded transition">
        TERMINATE SESSION
      </button>
    </header>

    <div class="p-6 max-w-7xl mx-auto w-full space-y-8 flex-1">
      
      <!-- System Metrics -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-cyber-dark border border-cyber-cyan/30 p-5 rounded-xl shadow-[0_0_15px_rgba(0,240,255,0.1)]">
          <div class="text-xs text-stone-400 uppercase tracking-widest">Active Inventory</div>
          <div class="text-3xl font-bold text-cyber-cyan mt-1 neon-text-cyan" id="metric-products">12 SKUs</div>
        </div>
        <div class="bg-cyber-dark border border-cyber-pink/30 p-5 rounded-xl shadow-[0_0_15px_rgba(255,0,127,0.1)]">
          <div class="text-xs text-stone-400 uppercase tracking-widest">Low Stock Items</div>
          <div class="text-3xl font-bold text-cyber-pink mt-1 neon-text-pink" id="metric-lowstock">2 Vials</div>
        </div>
        <div class="bg-cyber-dark border border-cyber-green/30 p-5 rounded-xl shadow-[0_0_15px_rgba(0,255,102,0.1)]">
          <div class="text-xs text-stone-400 uppercase tracking-widest">System Status</div>
          <div class="text-3xl font-bold text-cyber-green mt-1">ONLINE</div>
        </div>
      </div>

      <!-- Inventory Management Table -->
      <div class="bg-cyber-dark border border-cyber-cyan/20 rounded-xl overflow-hidden">
        <div class="p-5 border-b border-cyber-cyan/20 flex justify-between items-center">
          <h2 class="text-lg font-bold text-cyber-cyan tracking-wider">INVENTORY CONTROL & STOCK OVERRIDE</h2>
          <button onclick="addNewProduct()" class="bg-cyber-cyan/10 border border-cyber-cyan text-cyber-cyan hover:bg-cyber-cyan hover:text-black text-xs font-bold px-3 py-2 rounded transition">
            + ADD NEW SKU
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-stone-300">
            <thead class="bg-cyber-black text-xs uppercase tracking-wider text-cyber-cyan border-b border-cyber-cyan/20">
              <tr>
                <th class="p-4">SKU / ID</th>
                <th class="p-4">Product Name</th>
                <th class="p-4">Category</th>
                <th class="p-4">Unit Price ($)</th>
                <th class="p-4">Stock Quantity</th>
                <th class="p-4">Actions</th>
              </tr>
            </thead>
            <tbody id="inventory-table-body" class="divide-y divide-stone-800">
              <!-- Loaded Dynamically via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SECRET_KEY = "battleborn2026"; // Change this to your preferred admin password

    let inventory = [
      { id: '1', name: 'R3 (10mg)', category: 'Growth-Factor', price: 70.00, stock: 10 },
      { id: '2', name: 'R3 (20mg)', category: 'Growth-Factor', price: 120.00, stock: 18 },
      { id: '3', name: 'BPC-157 (10mg)', category: 'Peptides', price: 50.00, stock: 25 },
      { id: '8', name: 'SS-31 (10mg)', category: 'Mitochondrial', price: 65.00, stock: 3 },
      { id: '9', name: 'SS-31 (50mg)', category: 'Mitochondrial', price: 180.00, stock: 0 }
    ];

    function authenticate(e) {
      e.preventDefault();
      const pass = document.getElementById('admin-pass').value;
      if (pass === SECRET_KEY) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        renderAdminTable();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
    }

    function renderAdminTable() {
      const tbody = document.getElementById('inventory-table-body');
      tbody.innerHTML = inventory.map((item, index) => `
        <tr class="hover:bg-cyber-card/50 transition">
          <td class="p-4 text-stone-500">#${item.id}</td>
          <td class="p-4 font-bold text-white">${item.name}</td>
          <td class="p-4 text-xs text-cyber-yellow uppercase">${item.category}</td>
          <td class="p-4 text-cyber-cyan font-bold">$<input type="number" value="${item.price}" onchange="updatePrice(${index}, this.value)" class="bg-cyber-black border border-stone-700 w-20 px-2 py-1 rounded text-white"/></td>
          <td class="p-4">
            <input type="number" value="${item.stock}" onchange="updateStock(${index}, this.value)" 
              class="bg-cyber-black border ${item.stock <= 5 ? 'border-cyber-pink text-cyber-pink' : 'border-cyber-green text-cyber-green'} w-20 px-2 py-1 rounded font-bold"/>
          </td>
          <td class="p-4">
            <button onclick="saveItem(${index})" class="text-xs bg-cyber-green/20 border border-cyber-green text-cyber-green px-3 py-1 rounded hover:bg-cyber-green hover:text-black transition">
              UPDATE
            </button>
          </td>
        </tr>
      `).join('');
    }

    function updateStock(index, val) {
      inventory[index].stock = parseInt(val) || 0;
    }

    function updatePrice(index, val) {
      inventory[index].price = parseFloat(val) || 0.00;
    }

    function saveItem(index) {
      alert(`Updated ${inventory[index].name}: Price $${inventory[index].price}, Stock: ${inventory[index].stock}`);
      renderAdminTable();
    }

    function addNewProduct() {
      const name = prompt("Enter product name (e.g. Semaglutide 20mg):");
      if (!name) return;
      inventory.push({ id: String(inventory.length + 1), name: name, category: 'Peptides', price: 90.00, stock: 10 });
      renderAdminTable();
    }
  </script>
</body>
</html>
